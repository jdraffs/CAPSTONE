<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SuperAdmin</title>
    <link rel="stylesheet" href="/private/css/pages/superAdmin.css">
    <link rel="stylesheet" href="/private/css/layout/dashboardsidebar.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!--SIDEBAR-->
    <section class="sidebar">
        <div class="logo">
            <img class="logoimage" src="/public/assets/images/PUPLogo.webp" alt="PUP Logo">
            <div class="logotitlewrap">
                <h2 class="logotitle logotitle1">PUP</h2>
                <h2 class="logotitle">Parañaque</h2>
            </div>
        </div>

        <div class="sidebar-divider"></div>

        <nav class="sidebar-nav">
            <div class="sidebar-scroll">
                <div class="nav-section">
                    <h3 class="nav-title">Main</h3>
                    <ul class="nav-list">
                        <li class="nav-item active">
                            <a class="nav-link" href="/private/html/adminPages/adminMila/adminMila.html">
                                <i class="fas fa-tachometer-alt"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="nav-section">
                    <h3 class="nav-title">Management</h3>
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="fa-solid fa-chart-line"></i>
                                <span>Placeholder</span>
                            </a>
                        </li>
                    </ul>
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="fa-solid fa-copy"></i>
                                <span>Placeholder</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="user-details">
                        <span class="user-name">AdminMila</span>
                    </div>
                </div>
            </div>
        </nav>
    </section>
    
    <!--MAIN CONTENT-->
    <main class="main">
        <header class="dashboard-header">
            <div class="header-left">
                <h1 class="page-title">Dashboard</h1>
            </div>
            <div class="header-right">
                <div class="notification-button">
                    <a class="notif-link" href="#notifications" data-page="overview">
                    <i class="fa fa-bell" aria-hidden="true"></i>
                    </a>
                </div>
                <div class="profile-button">
                    <a class="profile-link" data-page="profile">
                    <i class="fa fa-user" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
        <!-- Welcome Section -->
        </div>
    </main>

<!-- Scripts -->
<script src="/private/js/admin/adminMila/adminMila.js"></script> 
<script src="/private/js/admin/profileFunction.js"></script>
</body>
</html>
